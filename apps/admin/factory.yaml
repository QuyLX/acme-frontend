# Application descriptor (FE §7.2; one per app in the monorepo — DV-02). Control file (Standard §7.13).
# apiVersion: Standard Appendix K form; the FE §7.2 spelling "factory/v4" is also accepted until D-13 is decided.
apiVersion: aisf/4.0
kind: FactoryConfig
standard: aisf@4.0.0
profile: aisf-frontend@1.1.0
application: admin
owner: team-admin              # placeholder team id until owner identities are decided
backupOwners: [team-platform] # CORE-KNW-03: ≥ 2 eligible owners or a named backup
lifecycle: active
platform: { channel: stable }
surfaces: []                  # pending D-12 (demo modules)
contracts:
  consumes: []                # pending D-04 (contract format)
promptAssets: []
autonomy:
  zeroHumanOptIn: []          # A0 MUST NOT be enabled in pilot mode (Standard §20.8 item 4.7)
  aiReviewMode: {}
# Deterministic path → tier map (policy.risk; Standard §20.8 item 4). Only what FE §10.1 mandates is declared: the
# x:privileged-admin floor and the privileged path names. Tiers for other paths wait for D-12 (surfaces); until then
# every path outside this app stays unmatched = High (Standard §9.5 rule 4). Removing an entry is loosening.
riskMap:
  - paths: ["apps/admin/**"]
    tier: Medium
    subTier: R2
    reason: "x:privileged-admin floor: every Admin change is at least R2"
    source: "FE §10.1"
  - paths:
      - "apps/admin/src/**/{impersonation,impersonate,break-glass,step-up,cross-tenant,bulk,export,audit,pii}/**"
      - "apps/admin/src/server/{session,authz,auth}/**"
      - "apps/admin/src/**/*.{impersonation,export,audit}.{ts,tsx}"
    tier: High
    subTier: R3
    reason: "privileged path: impersonation, cross-tenant/bulk, step-up, break-glass, PII reveal, export, audit events, server-side session/authorization"
    source: "FE §10.1"
# Admin is x:privileged-admin: R2 floor for every change; privileged paths (impersonation, cross-tenant/bulk,
# step-up auth, break-glass, PII reveal, export, audit events, server-side session/authorization) are R3 (FE §10).
