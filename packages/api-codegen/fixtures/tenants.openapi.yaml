        tenantId: { type: string, format: uuid, x-data-class: internal }
        email: { type: string, format: email, x-data-class: personal }
        displayName: { type: string, x-data-class: personal }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
